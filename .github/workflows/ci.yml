name: TypeScript CI

on:
pull_request:
  branches: [dev]

jobs:
build-and-test:
  runs-on: ubuntu-latest

  steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: "npm"

    - name: Install dependencies
      run: npm ci

    - name: Build TypeScript
      run: npm run build

    - name: Lint TypeScript
      run: npm run lint

    - name: Format check
      run: npm run format

    - name: Run tests
      run: npm test